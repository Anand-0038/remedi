[project]
name = "remedi"
version = "0.10.0"
description = "On-call data agent: detect incidents via DataHub, generate fixes, write knowledge back"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Remedi Contributors" }]
keywords = ["datahub", "agents", "mcp", "data-quality", "lineage"]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "jinja2>=3.1.4",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
live = [
  "acryl-datahub[datahub-rest]>=1.0.0",
  "datahub-agent-context>=0.1.0",
]
dev = [
  "playwright>=1.50.0",
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[project.scripts]
remedi = "remedi.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remedi"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
